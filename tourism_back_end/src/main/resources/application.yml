spring:
  application:
    name: tourism_rear
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourism}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
     mail:
      transport:
        protocol: smtps
      smtps:
        auth: true
        ssl:
          enable: true
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000
      debug: true

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ZhongshanTourism_2026_!X9d2pA8vCqLr}
  expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

pickup:
  secret: ${PICKUP_SECRET:ZhongshanPickupSecret}
