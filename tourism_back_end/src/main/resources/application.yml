spring:
  application:
    name: tourism_rear
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:file:./config/application-secrets.yml,optional:file:../config/application-secrets.yml,optional:file:./tourism_back_end/config/application-secrets.yml}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourism}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
     mail:
      transport:
        protocol: smtps
      smtps:
        auth: true
        ssl:
          enable: true
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000
      debug: true

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ZhongshanTourism_2026_!X9d2pA8vCqLr}
  expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

pickup:
  secret: ${PICKUP_SECRET:ZhongshanPickupSecret}

qwen:
  api-key: ${QWEN_API_KEY:}
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  model: ${QWEN_MODEL:qwen3-max-2026-01-23}
  temp-token-url: ${QWEN_TEMP_TOKEN_URL:https://dashscope.aliyuncs.com/api/v1/tokens}
  temp-token-ttl: ${QWEN_TEMP_TOKEN_TTL:1800}
  timeout-ms: ${QWEN_TIMEOUT_MS:12000}
  proxy-host: ${QWEN_PROXY_HOST:}
  proxy-port: ${QWEN_PROXY_PORT:0}
